output_dir: {{ output_dir }}

dataset:
  class: biomedical
  path: {{ data_path }}
  include_factgraph: yes

task:
  class: KnowledgeGraphCompletionBiomed
  model:
    class: NBFNet
    input_dim: 32
    hidden_dims: [32, 32, 32, 32, 32, 32]
    message_func: distmult
    aggregate_func: pna
    short_cut: yes
    layer_norm: yes
    dependent: yes
    symmetric: yes
    symmetric_query_chunk_size: 2
  criterion: bce
  num_negative: 4
  strict_negative: yes
  adversarial_temperature: 0.5
  sample_weight: no
  heterogeneous_negative: yes
  heterogeneous_evaluation: yes
  full_batch_eval: no

optimizer:
  class: Adam
  lr: 5.0e-3

engine:
  gpus: {{ gpus }}
  batch_size: 2

train:
  num_epoch: 1
  batch_per_epoch: 1

metric: "mrr"
