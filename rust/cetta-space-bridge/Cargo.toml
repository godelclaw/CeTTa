[package]
name = "cetta-space-bridge"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["staticlib", "cdylib"]

[features]
default = ["pathmap-space"]
pathmap-space = []
loadable = ["dep:tikv-jemallocator"]

[dependencies]
log = "0.4"
mork = { workspace = true }
mork-expr = { workspace = true }
mork-frontend = { workspace = true }
pathmap = { workspace = true }
cetta-space = { workspace = true }
cetta-pathmap-adapter = { workspace = true }
cetta-mork-adapter = { workspace = true }
tikv-jemallocator = { version = "0.6", optional = true, features = ["disable_initial_exec_tls"] }
